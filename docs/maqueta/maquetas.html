<title>Sala Tricolor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Concepto: herramienta operativa de coordinación. Neutros fríos, un acento azul,
   y tres colores semánticos de horas: normal (verde azulado), extra tras turno (azul),
   extra en día sin turno (violeta). Ámbar reservado para "por revisar". */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface2:#edf0f5; --line:#dbe1ea;
  --fg:#18202b; --muted:#5a6678; --accent:#1f4fd8; --accent-fg:#ffffff;
  --normal:#0f766e; --normal-bg:#d8f1ed;
  --extra:#2457d6; --extra-bg:#dce7ff;
  --finde:#7432e0; --finde-bg:#ece2ff;
  --review:#9a5604; --review-bg:#fdebc6;
  --bad:#b42318; --bad-bg:#fde3e0;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171e28; --surface2:#1f2733; --line:#2b3544;
    --fg:#e8edf4; --muted:#9aa7b8; --accent:#7a9dff; --accent-fg:#0b1220;
    --normal:#4fd1c5; --normal-bg:#12332f;
    --extra:#82abff; --extra-bg:#17284d;
    --finde:#bda3ff; --finde-bg:#2a2050;
    --review:#f5c15a; --review-bg:#3a2a0c;
    --bad:#ff8f82; --bad-bg:#3b1a16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface2:#1f2733; --line:#2b3544;
  --fg:#e8edf4; --muted:#9aa7b8; --accent:#7a9dff; --accent-fg:#0b1220;
  --normal:#4fd1c5; --normal-bg:#12332f;
  --extra:#82abff; --extra-bg:#17284d;
  --finde:#bda3ff; --finde-bg:#2a2050;
  --review:#f5c15a; --review-bg:#3a2a0c;
  --bad:#ff8f82; --bad-bg:#3b1a16; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px}
header.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.flag{display:flex;flex-direction:column;width:26px;height:20px;border-radius:3px;overflow:hidden;flex:none;border:1px solid var(--line)}
.flag i{flex:1}.flag i:nth-child(1){background:#f4c20d}.flag i:nth-child(2){background:#1c3f94}.flag i:nth-child(3){background:#cf142b}
h1{font-size:20px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0}
.mockbar{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;padding-bottom:0}
nav.tabs a{white-space:nowrap;padding:9px 13px;border-radius:8px 8px 0 0;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;border-bottom:2px solid transparent}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:68ch;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card.flat{background:var(--surface2);border-style:dashed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
button:hover{background:var(--surface2)}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.pri:hover{filter:brightness(1.08);background:var(--accent)}
button.big{width:100%;padding:12px;font-size:16px;font-weight:600}
button.sm{padding:4px 9px;font-size:13px}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-out{background:var(--surface2);color:var(--muted)}
.p-in{background:var(--normal-bg);color:var(--normal)}
.p-done{background:var(--extra-bg);color:var(--extra)}
.p-rev{background:var(--review-bg);color:var(--review)}
.p-finde{background:var(--finde-bg);color:var(--finde)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.c-n{color:var(--normal)}.c-x{color:var(--extra)}.c-f{color:var(--finde)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.emp{display:flex;flex-direction:column;gap:10px}
.emp.is-out{background:var(--surface)}
.tramos{display:flex;gap:6px;flex-wrap:wrap;min-height:26px}
.tr{background:var(--surface2);border-radius:6px;padding:3px 8px;font-size:13px}
.tr.open{background:var(--normal-bg);color:var(--normal)}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.tot b{display:block;font-size:16px}
.avail td.cell{text-align:center;font-size:12.5px;white-space:nowrap;padding:8px 6px}
.avail td.cell.on{background:var(--normal-bg);color:var(--normal);font-weight:600}
.avail td.cell.off{color:var(--muted)}
.avail tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.avail tr{cursor:pointer}
.avail tfoot td{background:var(--surface2);font-weight:600;text-align:center}
.drow{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.drow:last-child{border-bottom:0}
.rg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.bal{position:relative;display:flex;height:14px;width:170px;min-width:120px}
.bal .h{flex:1;position:relative}
.bal .h i{position:absolute;top:2px;bottom:2px;border-radius:3px}
.bal .h.l i{right:0;background:var(--finde)}
.bal .h.rr i{left:0;background:var(--extra)}
.bal:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.open{background:var(--normal-bg);color:var(--normal)}
.banner.closed{background:var(--extra-bg);color:var(--extra)}
.banner.warn{background:var(--review-bg);color:var(--review)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;display:grid;gap:2px}
.log li:last-child{border-bottom:0}
.sugg{display:grid;gap:10px}
.sg{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sg.off{opacity:.6;background:var(--surface2)}
.rank{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:13px}
.sg.off .rank{background:var(--muted)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{padding-left:34px;position:relative}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.notes li{margin-bottom:5px}
.notes{margin:0;padding-left:18px}
.week7{display:grid;grid-template-columns:repeat(7,minmax(122px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.dcell{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:var(--surface);display:grid;gap:3px;align-content:start;min-width:0}
.dcell.none{background:var(--surface2)}
.dh{display:flex;gap:6px;align-items:baseline}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
.confirm{background:var(--bad-bg);color:var(--fg);border:1px solid var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:12px}
@media (max-width:520px){.drow{grid-template-columns:1fr}.sg{grid-template-columns:28px 1fr}.sg .act{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.card,button{transition:background .15s,filter .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
      <div><h1>Sala Tricolor</h1><p class="sub">Asistencia y horas de la coordinación</p></div>
    </div>
    <span class="pill p-in"><span class="dot"></span> En línea: tú y Coordinador 2</span>
  </header>
  <div class="mockbar">Maqueta con datos de ejemplo, no es el sistema final. Puedes tocar los botones y cambiar valores para ver cómo reacciona; nada se guarda. Los nombres son inventados.</div>
  <nav class="tabs" id="tabs" aria-label="Pantallas"></nav>

  <section id="v-resumen"></section>
  <section id="v-hoy" hidden></section>
  <section id="v-turnos" hidden></section>
  <section id="v-disponibilidad" hidden></section>
  <section id="v-semana" hidden></section>
  <section id="v-sugerencia" hidden></section>
  <section id="v-empleados" hidden></section>
  <section id="v-cierre" hidden></section>
</div>
<div id="toast" hidden></div>

<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAYSL=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const pad=n=>String(n).padStart(2,'0');
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dur=m=>Math.floor(m/60)+':'+pad(m%60);
const durL=m=>Math.floor(m/60)+' h'+(m%60?' '+pad(m%60)+' min':'');
const sgn=m=>(m<0?'−':'+')+dur(Math.abs(m));
const toMin=v=>{const [h,m]=v.split(':').map(Number);return h*60+m;};
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600);}

/* ---------- cálculo de horas (la misma regla que usará el sistema) ---------- */
const SHIFT=[540,960]; // turno general 9:00–16:00
function ov(a,b,c,d){return Math.max(0,Math.min(b,d)-Math.max(a,c));}
function calc(tramos,now,noShift){
  let n=0,x=0,pre=0;
  for(const [s,e0] of tramos){
    const e=Math.max(s,e0==null?now:e0);
    if(noShift){x+=e-s;}
    else{n+=ov(s,e,SHIFT[0],SHIFT[1]);x+=ov(s,e,SHIFT[1],1440);pre+=ov(s,e,0,SHIFT[0]);}
  }
  return {n,x,pre,total:n+x};
}
function rnd(t){ // 0–15 baja, 45–59 sube, 16–44 queda exacto y se marca "por revisar"
  const m=t%60,h=t-m;
  if(t===0||m<=15)return {v:h,rev:false};
  if(m>=45)return {v:h+60,rev:false};
  return {v:t,rev:true};
}

/* ---------- datos de ejemplo ---------- */
const emps=[
 {id:1,name:'Ana Pérez',archived:false,avail:{0:[[540,960]],1:[[540,960]],2:[[540,960]]}},
 {id:2,name:'Luis Mora',archived:false,avail:{0:[[540,960]],1:[[540,960]],2:[[540,960]],3:[[540,960]],4:[[540,960]],5:[[540,780]]}},
 {id:3,name:'María Rojas',archived:false,avail:{1:[[540,960]],2:[[540,720],[840,960]],3:[[540,960]]}},
 {id:4,name:'Carlos Díaz',archived:false,avail:{0:[[540,960]],3:[[540,960]],4:[[540,960]]}},
 {id:5,name:'Rosa Linares',archived:false,avail:{0:[[540,960]],1:[[540,960]],2:[[540,960]],3:[[540,780]],4:[[540,960]]}},
 {id:6,name:'José Silva',archived:false,avail:{4:[[540,960]],5:[[540,960]],6:[[540,960]]}}
];
const byId=id=>emps.find(e=>e.id===id);
const act=()=>emps.filter(e=>!e.archived);
const Z={days:0,n:0,x:0,f:0,rev:0};
const WK={
  cur:{label:'23–29 nov',title:'Semana actual (en curso, hasta hoy miércoles)',data:{1:{days:2,n:840,x:0,f:0,rev:0},2:{days:3,n:1200,x:60,f:0,rev:0},3:{days:2,n:780,x:0,f:0,rev:0},4:{days:1,n:420,x:0,f:0,rev:0},5:{days:3,n:1140,x:30,f:0,rev:0},6:{days:0,n:0,x:0,f:0,rev:0}}},
  closed:{label:'16–22 nov',title:'Semana anterior (cerrada)',data:{1:{days:3,n:1260,x:30,f:0,rev:0},2:{days:6,n:2100,x:120,f:240,rev:1},3:{days:3,n:1260,x:0,f:0,rev:0},4:{days:3,n:1200,x:60,f:0,rev:0},5:{days:5,n:1800,x:90,f:0,rev:0},6:{days:3,n:420,x:0,f:660,rev:0}}}
};
/* desglose diario: tramos por empleado y día (0=lunes … 6=domingo) */
const DD={
 cur:{1:{0:[[540,960]],1:[[540,960]]},2:{0:[[540,960]],1:[[540,1020]]},3:{1:[[540,960]]},4:{0:[[540,960]]},5:{0:[[540,960]],1:[[540,960]]},6:{}},
 closed:{1:{0:[[540,960]],1:[[540,1020]],2:[[540,960]]},
  2:{0:[[540,960]],1:[[542,1000]],2:[[540,960]],3:[[540,960]],4:[[540,960]],5:[[540,780]]},
  3:{1:[[540,960]],2:[[540,720],[840,960]],3:[[540,960]]},
  4:{0:[[540,960]],3:[[540,1020]],4:[[540,960]]},
  5:{0:[[540,960]],1:[[540,960]],2:[[540,960]],3:[[540,780]],4:[[540,1020]]},
  6:{4:[[540,960]],5:[[540,840]],6:[[540,900]]}}
};
function build(wk){const out={};for(const id in DD[wk]){const o={days:0,n:0,x:0,f:0,rev:0};
  for(const [di,tr] of Object.entries(DD[wk][id])){const ns=+di>=5,c=calc(tr,0,ns),r=rnd(c.total);o.days++;o.n+=c.n;if(ns)o.f+=c.x;else o.x+=c.x;if(r.rev)o.rev++;}
  out[id]=o;}return out;}
WK.cur.data=build('cur');WK.closed.data=build('closed');WK.cur.title='Semana actual (en curso, hasta el martes 24)';
const wd=(wk,id)=>WK[wk].data[id]||Z;
function detailHTML(wk){
  if(!W.det)return '';
  const e=byId(W.det);if(!e||e.archived)return '';
  const base=wk==='cur'?23:16,dd=DD[wk][e.id]||{};
  let sn=0,sx=0,sf=0,st=0;
  const cells=DAYS.map((d,i)=>{
    const tr=dd[i]||[],ns=i>=5,c=calc(tr,0,ns),r=rnd(c.total),fut=wk==='cur'&&i>=2;
    sn+=c.n;if(ns)sf+=c.x;else sx+=c.x;st+=r.v;
    const body=tr.length?`<div class="tiny muted">${tr.map(([a,b])=>hm(a)+'–'+hm(b)).join(' · ')}</div>${ns?`<div class="small c-f">Extra sin turno ${dur(c.x)}</div>`:`<div class="small c-n">Normales ${dur(c.n)}</div>${c.x?`<div class="small c-x">Extra ${dur(c.x)}</div>`:''}`}<div class="num"><strong>${dur(r.v)}</strong></div>${r.rev?'<span class="pill p-rev">por revisar</span>':''}`:`<div class="muted small">${fut?'Pendiente':'No asistió'}</div>`;
    return `<div class="dcell ${tr.length?'':'none'}"><div class="dh"><strong>${d}</strong> <span class="muted tiny">${base+i} nov</span></div>${ns?'<span class="pill p-finde">sin turno</span>':''}${body}</div>`;
  }).join('');
  const tabla=wtot(wd(wk,e.id));
  return `<div class="card" style="margin-top:14px"><div class="row sp"><h3 style="margin:0">Desglose de ${esc(e.name)} · semana ${WK[wk].label}</h3><button class="sm" data-det="${e.id}">Cerrar</button></div><p class="tiny muted" style="margin:4px 0 10px">Cada día con sus tramos, para justificar el total de la semana.</p><div class="week7">${cells}</div><div class="row sp small" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px"><span>Suma de los días: <span class="c-n">normales ${dur(sn)}</span> · <span class="c-x">extra tras turno ${dur(sx)}</span> · <span class="c-f">extra sin turno ${dur(sf)}</span></span><strong class="num">Total ${dur(st)}${st===tabla?', igual al de la tabla':', no coincide con la tabla'}</strong></div></div>`;
}
const wtot=d=>d.n+d.x+d.f;

/* ---------- navegación ---------- */
const TABS=[['resumen','Cómo funciona'],['hoy','Hoy'],['turnos','Turnos'],['disponibilidad','Disponibilidad'],['semana','Resumen semanal'],['sugerencia','Sugerencia'],['empleados','Empleados'],['cierre','Cierre y bitácora']];
function nav(){
  const cur=(location.hash||'#resumen').slice(1);
  const id=TABS.some(t=>t[0]===cur)?cur:'resumen';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<a href="#${k}" class="${k===id?'on':''}">${l}</a>`).join('');
  TABS.forEach(([k])=>{$('#v-'+k).hidden=k!==id;});
  renderAll();
}
addEventListener('hashchange',nav);

/* ---------- HOY ---------- */
const real=(()=>{try{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Caracas',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const g=t=>+p.find(x=>x.type===t).value;return (g('hour')%24)*60+g('minute');}catch(e){return 930;}})();
const H={noShift:false,now:hm(real>=600&&real<=1020?real:930),
  tr:{1:[[480,660],[840,960]],2:[[542,1000]],3:[[540,null]],4:[],5:[[550,780],[840,null]],6:[]}};
const nowM=()=>toMin(H.now);
const stat=id=>{const t=H.tr[id]||[];if(!t.length)return 'out';return t[t.length-1][1]==null?'in':'done';};
function mark(id){
  const t=(H.tr[id]=H.tr[id]||[]),now=nowM();
  if(stat(id)==='in'){
    const l=t[t.length-1];
    if(now<=l[0]){toast('Validación: la salida no puede ser anterior a la entrada ('+hm(l[0])+').');return;}
    l[1]=now;
  }else{
    const l=t[t.length-1];
    if(l&&now<l[1]){toast('Validación: la entrada no puede ser anterior a la última salida ('+hm(l[1])+').');return;}
    t.push([now,null]);
  }
}
function adj(id,d){
  const t=H.tr[id]||[];if(!t.length)return;
  const l=t[t.length-1];
  if(l[1]==null){
    const prev=t.length>1?t[t.length-2][1]:0;
    const v=l[0]+d;if(v<prev){toast('Validación: choca con la salida anterior.');return;}l[0]=v;
  }else{
    const v=l[1]+d;if(v<=l[0]){toast('Validación: la salida no puede ser anterior a la entrada.');return;}l[1]=v;
  }
}

}

   ['José Silva · sábado','9:00–14:00',[[540,840]],true,'No hay turno: las 5:00 son extra de día sin turno.']];

    return `<tr><td><strong>${n}</strong><div class="tiny muted">${t}</div></td><td class="num r c-n">${dur(c.n)}</td><td class="num r ${ns?'c-f':'c-x'}">${dur(c.x)}</td><td class="num r"><strong>${dur(r.v)}</strong>${r.rev?' <span class="pill p-rev">por revisar</span>':''}</td><td class="small muted">${nota}</td></tr>`;}).join('');
  $('#v-resumen').innerHTML=`
    <h2>Cómo funcionaría el sistema</h2>
    <p class="lead">Es una herramienta interna de la coordinación para marcar quién vino, cuánto tiempo estuvo y totalizar las horas por semana. No maneja pagos: entrega horas. Los empleados no tienen acceso.</p>
    <div class="grid">
      <div class="card"><h3>Quién lo usa</h3><ul class="notes small"><li>Varios coordinadores, todos con los mismos permisos: ven y editan todo.</li><li>Funciona en la nube, en celular o computador, y todos ven los cambios en tiempo real.</li><li>Cada cambio queda en la bitácora con quién, cuándo y qué.</li></ul></div>
      <div class="card"><h3>Qué no hace</h3><ul class="notes small"><li>No calcula pagos ni precios.</li><li>No asigna turnos a personas. Cada quien viene o no, y se le marcan las horas de lo que vino.</li><li>No le da acceso a los empleados.</li></ul></div>
      <div class="card"><h3>Un día cualquiera</h3>
        <ol class="steps small"><li><strong>Hoy:</strong> se toca "Entró" y "Salió" en la tarjeta de cada empleado. Si va y viene, se marca otro tramo.</li><li>Para los días normales, se marcan todos en bloque y se corrigen las excepciones.</li><li>Al final de la semana se revisa el resumen y se cierra.</li><li>Para el siguiente turno se consulta la sugerencia.</li></ol></div>
    </div>
    <h3 style="margin-top:22px">Cómo se cuentan las horas</h3>
    <ul class="notes small" style="margin-bottom:10px"><li>Cada día es una lista de tramos (entró y salió). Se suman.</li><li>Dentro del turno son horas <span class="c-n"><strong>normales</strong></span>. Después del fin del turno son <span class="c-x"><strong>extra</strong></span>. Antes del inicio no cuenta.</li><li>En un día sin turno (sábado o domingo) todo es <span class="c-f"><strong>extra de día sin turno</strong></span>, con otro color y desglosado en los reportes.</li><li>El redondeo es sobre el total del día: de 0 a 15 min baja a la hora, de 45 a 59 sube. De 16 a 44 queda exacto y se marca para que la coordinación decida.</li></ul>
    <div class="tw"><table><thead><tr><th>Ejemplo</th><th class="r">Normales</th><th class="r">Extra</th><th class="r">Total del día</th><th>Por qué</th></tr></thead><tbody>${rowsE}</tbody></table></div>
    <div class="grid" style="margin-top:18px">
      <div class="card"><h3>Equilibrio y sugerencia</h3><p class="small">Cada semana se calcula el promedio del equipo con las horas totales (normales y extra). Se ve quién va por encima o por debajo. Para el siguiente turno, el sistema lista a los disponibles de menos a más horas acumuladas. La decisión es de la coordinación, y se anota a quién se avisó.</p></div>
      <div class="card"><h3>Semanas cerradas</h3><p class="small">Al entregar los totales se cierra la semana. Se puede corregir con un motivo, y el sistema muestra la diferencia contra lo entregado. Cada nuevo cierre es una versión.</p></div>
      <div class="card"><h3>Datos y seguridad</h3><p class="small">Horas guardadas en UTC y mostradas en hora de Venezuela. Empleados archivados en lugar de eliminados. Copias de seguridad automáticas. Contraseñas protegidas.</p></div>
    </div>
    <div class="grid" style="margin-top:18px">
      <div class="card"><h3>Etapas</h3><ol class="steps small"><li><strong>Base:</strong> empleados, turnos, disponibilidad, pantalla Hoy, cálculo de horas, bitácora.</li><li><strong>Equilibrio:</strong> resumen semanal, promedio, sugerencia y registro de avisos.</li><li><strong>Reportes:</strong> cierre de semana, historial, Excel y PDF semanal y mensual.</li></ol></div>
      <div class="card flat"><h3>Por confirmar</h3><ul class="notes small"><li>¿Los reportes de Excel y PDF llevan algún encabezado o logo del ente superior?</li><li>¿Cuántos coordinadores tendrán cuenta al inicio?</li><li>¿Se alcanza a ver bien la distinción de colores entre extra tras turno y extra de día sin turno?</li></ul></div>
    </div>`;
}

/* ---------- eventos ---------- */
function renderAll(){renderResumen();renderHoy();renderTurnos();renderDisp();renderSemana();renderSug();renderEmp();renderCierre();}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button,tr[data-sel]');if(!b)return;const d=b.dataset;
  if(d.mark){mark(+d.mark);renderHoy();}
  else if(d.adj){adj(+d.adj,+d.d);renderHoy();}
  else if(d.undo){undo(+d.undo);renderHoy();}
  else if(d.all==='in'){act().forEach(e=>{if(!(H.tr[e.id]||[]).length)H.tr[e.id]=[[540,null]];});renderHoy();}
  else if(d.all==='out'){act().forEach(e=>{const t=H.tr[e.id]||[],l=t[t.length-1];if(l&&l[1]==null&&l[0]<960)l[1]=960;});renderHoy();}
  else if(d.sel){A.sel=+d.sel;renderDisp();}
  else if(d.add!==undefined){const e=byId(A.sel),i=+d.add,rs=e.avail[i]=e.avail[i]||[];
    if(!rs.length)rs.push([540,960]);else{const l=rs[rs.length-1][1];if(l>=1380)toast('No hay espacio para otra franja.');else rs.push([l,Math.min(l+60,1440)]);}
    renderDisp();renderSug();renderSemana();}
  else if(d.rm){const [i,k]=d.rm.split(':').map(Number),e=byId(A.sel);e.avail[i].splice(k,1);if(!e.avail[i].length)delete e.avail[i];renderDisp();renderSug();}
  else if(d.det){W.det=W.det===+d.det?null:+d.det;renderSemana();}
  else if(d.close==='1'){W.confirm=true;renderSemana();}
  else if(d.close==='yes'){W.curClosed=true;W.confirm=false;renderSemana();}
  else if(d.close==='no'){W.confirm=false;renderSemana();}
  else if(d.call){SG.calls[d.call]=((SG.calls[d.call]||0)+1)%CALL.length;renderSug();}
  else if(d.edit){E.editing=+d.edit;renderEmp();}
  else if(d.ecancel){E.editing=null;renderEmp();}
  else if(d.esave){const v=$('#en').value.trim();if(!v){toast('El nombre no puede quedar vacío.');return;}byId(+d.esave).name=v;E.editing=null;renderAll();}
  else if(d.arch){E.confirm=+d.arch;renderEmp();}
  else if(d.ano){E.confirm=null;renderEmp();}
  else if(d.aok){const e=byId(E.confirm);e.archived=true;C.log.unshift(['ahora','Tú','Archivó a '+e.name+' (historial conservado)','']);E.confirm=null;renderAll();toast('Archivado. Su historial se conserva.');}
  else if(d.react){byId(+d.react).archived=false;renderAll();}
  else if(d.v2){C.ver++;C.log.unshift(['ahora','Tú','Volvió a cerrar la semana 16–22 nov (versión '+C.ver+')','']);C.diff=null;renderCierre();toast('Semana cerrada de nuevo.');}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='clk'&&t.value){H.now=t.value;renderHoy();}
  else if(t.id==='ns'){H.noShift=t.checked;renderHoy();}
  else if(t.id==='wsel'){W.wk=t.value;W.confirm=false;W.det=null;renderSemana();}
  else if(t.id==='sd'){SG.day=+t.value;renderSug();}
  else if(t.id==='sa'){E.arch=t.checked;renderEmp();}
  else if(t.id==='cp'&&t.value){const s=byId(+t.value),e=byId(A.sel);e.avail=JSON.parse(JSON.stringify(s.avail));renderDisp();renderSug();toast('Disponibilidad copiada de '+s.name+'.');}
  else if(t.dataset&&t.dataset.d!==undefined&&t.dataset.p!==undefined&&t.type==='time'&&t.value){
    const e=byId(A.sel),i=+t.dataset.d,k=+t.dataset.k,p=+t.dataset.p;
    const cand=e.avail[i].map(r=>r.slice());cand[k][p]=toMin(t.value);
    const err=okRanges(cand);
    if(err){toast('Validación: '+err);renderDisp();return;}
    e.avail[i]=cand;renderDisp();renderSug();
  }
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  if(ev.target.id==='addf'){const v=$('#nn').value.trim();if(!v){toast('Escribe un nombre.');return;}
    emps.push({id:Date.now(),name:v,archived:false,avail:{}});C.log.unshift(['ahora','Tú','Agregó al empleado '+v,'']);renderAll();toast('Empleado agregado. Falta registrar su disponibilidad.');}
  else if(ev.target.id==='corr'){
    const m=$('#cm').value.trim();if(!m){toast('Validación: el motivo es obligatorio en una semana cerrada.');return;}
    const nuevo=toMin($('#cn').value),delta=nuevo-1000;
    if(nuevo<=542){toast('Validación: la salida no puede ser anterior a la entrada.');return;}
    C.diff=sgn(delta);C.log.unshift(['ahora','Tú','Corrigió la salida de Luis Mora (17 nov): 16:40 → '+hm(nuevo),m]);renderCierre();}
});
nav();
</script>
